<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方寸样页 · 透明玻璃风</title>
<style>
:root { --stage-bg:#dfe7f2; --slide-bg:#dfe7f2; }
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.2s!important;}}

.ambient{position:absolute;inset:0;background:
  radial-gradient(1100px 750px at 82% 8%, rgba(147,197,253,.55), transparent 62%),
  radial-gradient(1000px 700px at 8% 92%, rgba(196,181,253,.5), transparent 60%),
  radial-gradient(800px 520px at 55% 45%, rgba(110,231,183,.28), transparent 65%),
  linear-gradient(160deg,#eef3fa 0%,#e2e9f4 100%);}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;}
.orb.o1{width:340px;height:340px;left:12%;top:16%;background:radial-gradient(circle at 30% 30%,#fff, #bcd4f5);animation:float 9s ease-in-out infinite alternate;}
.orb.o2{width:220px;height:220px;right:14%;bottom:18%;background:radial-gradient(circle at 30% 30%,#fff,#d9c9f7);animation:float 12s ease-in-out infinite alternate-reverse;}
@keyframes float{from{transform:translateY(-24px)}to{transform:translateY(24px)}}
.wordmark{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:18px;z-index:5;}
.wordmark .nine{font:900 44px/1 "Microsoft YaHei",sans-serif;color:#1f2a3d;letter-spacing:2px;}
.wordmark .nine em{font-style:normal;color:#2563eb;}
.wordmark .sub{font:400 20px/1.4 "Microsoft YaHei",sans-serif;color:rgba(31,42,61,.6);border-left:1px solid rgba(31,42,61,.25);padding-left:18px;letter-spacing:3px;}
.intro-hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font:300 22px/1 "Microsoft YaHei",sans-serif;color:rgba(31,42,61,.5);letter-spacing:6px;z-index:5;animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.95}}
#intro{position:absolute;inset:0;z-index:3;}
.glass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1400px;padding:100px 120px;border-radius:32px;
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.30));
  border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 90px rgba(31,42,61,.16), inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(20px);text-align:center;z-index:4;}
.kicker{font:400 24px/1 "Microsoft YaHei",sans-serif;color:#2563eb;letter-spacing:12px;margin-bottom:44px;}
h1.title{font:900 78px/1.35 "Microsoft YaHei",sans-serif;color:#131c2c;margin:0 0 34px;letter-spacing:2px;}
h1.title .hl{background:linear-gradient(120deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;}
.meta{font:300 26px/1.8 "Microsoft YaHei",sans-serif;color:rgba(19,28,44,.66);letter-spacing:2px;}
.enter{display:inline-block;margin-top:56px;padding:20px 74px;border-radius:999px;border:1px solid rgba(255,255,255,.8);
  font:500 26px/1 "Microsoft YaHei",sans-serif;color:#fff;letter-spacing:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);cursor:pointer;transition:transform .2s, box-shadow .2s;box-shadow:0 12px 30px rgba(37,99,235,.35);}
.enter:hover{transform:translateY(-3px);}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
  <section class="slide active" id="prologue">
    <div class="ambient"></div><div class="orb o1"></div><div class="orb o2"></div>
    <div class="wordmark"><span class="nine">九<em>号</em></span><span class="sub">电动车事业部</span></div>
    <canvas id="intro" width="1920" height="1080"></canvas>
    <div class="intro-hint">点 击 散 开 · 再 次 聚 成 后 进 入</div>
  </section>
  <section class="slide" id="cover">
    <div class="ambient"></div><div class="orb o1"></div><div class="orb o2"></div>
    <div class="wordmark"><span class="nine">九<em>号</em></span><span class="sub">电动车事业部</span></div>
    <div class="glass">
      <div class="kicker">试 用 期 工 作 总 结</div>
      <h1 class="title">以 <span class="hl">AI</span> 为杠杆的<br>供应商质量管理实践</h1>
      <div class="meta">欧阳光 · 助理SQE ｜ 供应链质量工程部 · 三电组<br>带教：王可欣 ｜ 2026.05 — 2026.09</div>
      <div class="enter" id="enterBtn">进 入 汇 报</div>
    </div>
  </section>
</div></div>
<script src="particles.js"></script>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);var st=document.getElementById('stage');st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')';}
addEventListener('resize',fit);fit();
function toCover(){document.getElementById('prologue').classList.remove('active');document.getElementById('cover').classList.add('active');}
new FangcunIntro({canvas:document.getElementById('intro'),text:'AI 杠杆',color:'#2b3a55',onDone:toCover});
document.getElementById('enterBtn').addEventListener('click',function(){/* 后续接正文 */});
</script>
</body>
</html>
